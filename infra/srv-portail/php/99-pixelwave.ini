; /etc/php/<version>/apache2/conf.d/99-pixelwave.ini — durcissement PHP du portail
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/pixelwave/php-erreurs.log
allow_url_include = Off
; le portail n'accepte pas de fichiers envoyés
file_uploads = Off
post_max_size = 1M
max_execution_time = 15
memory_limit = 128M
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 7200
date.timezone = Europe/Paris
