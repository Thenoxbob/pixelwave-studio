# /etc/apache2/sites-available/pixelwave-portail.conf
# Portail joueurs PixelWave — SRV-PORTAIL (DMZ 192.168.70.11)

# HTTP : uniquement une redirection vers HTTPS
<VirtualHost *:80>
    ServerName portail.pixelwave.lan
    ServerAlias portail.pixelwave-studio.fr 192.168.70.11
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName portail.pixelwave.lan
    ServerAlias portail.pixelwave-studio.fr 192.168.70.11

    # Seul le dossier public/ est exposé : le code, la configuration et les scripts SQL restent hors du web
    DocumentRoot /var/www/pixelwave/portail/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/pixelwave-portail.crt
    SSLCertificateKeyFile /etc/ssl/private/pixelwave-portail.key
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off

    Header always set Strict-Transport-Security "max-age=31536000"

    <Directory /var/www/pixelwave/portail/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted

        # contrôleur frontal (équivalent du .htaccess, plus performant dans le vhost)
        RewriteEngine On
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # interdit tout fichier caché (.git, .env...) même s'il était copié par erreur dans public/
    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/pixelwave-erreurs.log
    CustomLog ${APACHE_LOG_DIR}/pixelwave-acces.log combined
</VirtualHost>
