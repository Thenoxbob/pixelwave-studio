{
    "Dhcp4": {
        "interfaces-config": {
            "interfaces": [
                "ens18"
            ],
            "dhcp-socket-type": "udp"
        },
        "control-socket": {
            "socket-type": "unix",
            "socket-name": "/run/kea/kea4-ctrl-socket"
        },
        "lease-database": {
            "type": "memfile",
            "persist": true,
            "name": "/var/lib/kea/kea-leases4.csv",
            "lfc-interval": 3600
        },
        "valid-lifetime": 28800,
        "renew-timer": 14400,
        "rebind-timer": 25200,
        "authoritative": true,
        "option-data": [
            {
                "name": "domain-name-servers",
                "data": "192.168.60.11"
            },
            {
                "name": "domain-name",
                "data": "pixelwave.lan"
            },
            {
                "name": "domain-search",
                "data": "pixelwave.lan"
            }
        ],
        "subnet4": [
            {
                "id": 10,
                "subnet": "192.168.10.0/24",
                "user-context": {
                    "vlan": 10,
                    "service": "Direction"
                },
                "pools": [
                    {
                        "pool": "192.168.10.100 - 192.168.10.200"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "192.168.10.1"
                    }
                ],
                "reservations": []
            },
            {
                "id": 20,
                "subnet": "192.168.20.0/24",
                "user-context": {
                    "vlan": 20,
                    "service": "Développement"
                },
                "pools": [
                    {
                        "pool": "192.168.20.100 - 192.168.20.200"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "192.168.20.1"
                    }
                ],
                "reservations": []
            },
            {
                "id": 30,
                "subnet": "192.168.30.0/24",
                "user-context": {
                    "vlan": 30,
                    "service": "Marketing"
                },
                "pools": [
                    {
                        "pool": "192.168.30.100 - 192.168.30.200"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "192.168.30.1"
                    }
                ],
                "reservations": []
            },
            {
                "id": 40,
                "subnet": "192.168.40.0/24",
                "user-context": {
                    "vlan": 40,
                    "service": "Support / QA"
                },
                "pools": [
                    {
                        "pool": "192.168.40.100 - 192.168.40.200"
